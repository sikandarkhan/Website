<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form align="center">

        <pre><h1>
<a href="index.html" style="text-decoration: none;">HOME</a>               <a href="About.html" style="text-decoration: none;">ABOUT</a>               <a href="Services.html" style="text-decoration: none;">SERVICES</a>               <a href="Contact.html" style="text-decoration: none;">CONTACT</a>               SEARCH <input type="search" placeholder="Search">
        </h1></pre>

    </form>

    <hr>

    <header>
        <h1 align="center">WELCOME TO SIKANDAR WEBSITE</h1>

        <hr>

        <br>

        <h2 align="center">Register Yourself Below...!</h2>

        <br>

        <h2 align="center">Personal Information</h2>
    </header>


    <main align="center">

        <form id="personalForm">

            <input
                type="text"
                id="firstName"
                placeholder="First Name"
                size="17"
                required
            >

            <input
                type="text"
                id="lastName"
                placeholder="Last Name"
                size="17"
            >

            <br><br>


            <input
                type="text"
                id="username"
                placeholder="Username"
                size="17"
                pattern="^[a-zA-Z0-9_]+$"
                required
            >

            <input
                type="tel"
                id="phone"
                placeholder="Phone Number"
                size="17"
                pattern="[0-9]{10}"
                required
            >

            <br><br>


            <input
                type="email"
                id="email"
                placeholder="Email"
                size="40"
                required
            >

            <br><br>


            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                size="40"
                minlength="8"
                maxlength="15"
                required
            >

            <br><br>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm Password"
                size="40"
                minlength="8"
                maxlength="15"
                required
            >

            <br><br>


            <button type="submit">
                Submit
            </button>

        </form>

    </main>


    <script>

        document.getElementById("personalForm").addEventListener("submit", function(event) {

            event.preventDefault();


            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {

                alert("Passwords do not match!");

                return;
            }


            /*
            Save personal information
            */

            localStorage.setItem(
                "firstName",
                document.getElementById("firstName").value
            );

            localStorage.setItem(
                "lastName",
                document.getElementById("lastName").value
            );

            localStorage.setItem(
                "username",
                document.getElementById("username").value
            );

            localStorage.setItem(
                "phone",
                document.getElementById("phone").value
            );

            localStorage.setItem(
                "email",
                document.getElementById("email").value
            );


            /*
            Go to application details
            */

            window.location.href = "appli.html";

        });

    </script>

</body>

</html>
