<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Application Details</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <form align="center">

        <pre><h1>
<a href="index.html" style="text-decoration: none;">HOME</a>               <a href="About.html" style="text-decoration: none;">ABOUT</a>               <a href="Services.html" style="text-decoration: none;">SERVICES</a>               <a href="Contact.html" style="text-decoration: none;">CONTACT</a>               SEARCH <input type="search" placeholder="Search">
        </h1></pre>

    </form>


    <hr>


    <header align="center">

        <h1>WELCOME TO SIKANDAR WEBSITE</h1>

        <hr>

        <br>

        <h2>Register Yourself Below...!</h2>

        <br>

        <h2>Application Details</h2>

    </header>


    <main align="center">


        <form id="applicationForm">


            <select id="role" required>

                <option value="" disabled selected>
                    Choose The Role
                </option>

                <option value="Frontend">
                    Frontend Developer
                </option>

                <option value="Backend">
                    Backend Developer
                </option>

                <option value="Fullstack">
                    Fullstack Developer
                </option>

                <option value="UI/UX">
                    UI/UX Designer
                </option>

            </select>


            <br><br>


            <input
                type="number"
                id="salary"
                placeholder="Expected Salary"
                min="15000"
                step="2000"
                required
            >


            <br><br>


            <input
                type="date"
                id="startDate"
                required
            >


            <br><br>


            <input
                type="url"
                id="portfolio"
                placeholder="Portfolio URL"
                required
            >


            <br><br>


            <button
                type="button"
                onclick="goBack()">
                &lt; Edit
            </button>


            <button type="submit">
                Submit
            </button>


        </form>


    </main>


    <script>


        /*
        Edit button
        */

        function goBack() {

            window.location.href = "index.html";

        }



        /*
        Application form
        */

        document
            .getElementById("applicationForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                /*
                Save application information
                */

                localStorage.setItem(
                    "role",
                    document.getElementById("role").value
                );


                localStorage.setItem(
                    "salary",
                    document.getElementById("salary").value
                );


                localStorage.setItem(
                    "startDate",
                    document.getElementById("startDate").value
                );


                localStorage.setItem(
                    "portfolio",
                    document.getElementById("portfolio").value
                );


                /*
                Go to Experience & Skills
                */

                window.location.href = "xp.html";

            });


    </script>


</body>

</html>
